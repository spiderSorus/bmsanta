[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bmsanta"
version = "0.1.0"
description = "BMS Controller & Inverter Gateway for CATL 24V LBM025100A Battery Modules"
authors = [
    { name = "BMSanta Team" }
]
readme = "project.md"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "python-can>=4.2.0",
]

[project.scripts]
bmsanta = "daemon.main:main"
bmsanta-live = "tools.live_cells:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["daemon*", "tools*"]
